map $http_x_forwarded_proto $prism_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 105m;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
    }

    location /render/ {
        proxy_pass http://backend:8080/render/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /placeholders/ { try_files $uri =404; }
    location = /event-site.css { try_files $uri =404; }

    location ~ ^/(login|register|staff|app|admin)(/|$) {
        try_files $uri /index.html;
    }

    location ~ "^/([a-z0-9]+(?:-[a-z0-9]+)*)$" {
        proxy_pass http://backend:8080/render/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $prism_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
