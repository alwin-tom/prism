services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: ${DATABASE_USERNAME:-prism}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-prism} -d prism"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/prism
      DATABASE_USERNAME: ${DATABASE_USERNAME:-prism}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      JWT_SECRET: ${JWT_SECRET:-local-only-prism-jwt-secret-change-me}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-900}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      PRISM_OTP_BYPASS_ENABLED: ${PRISM_OTP_BYPASS_ENABLED:-true}
      PRISM_PAYMENT_BYPASS_ENABLED: ${PRISM_PAYMENT_BYPASS_ENABLED:-true}
      PRISM_ADVANCED_EDITOR_ENABLED: ${PRISM_ADVANCED_EDITOR_ENABLED:-false}
      PRISM_AI_WEBSITE_GENERATION_ENABLED: ${PRISM_AI_WEBSITE_GENERATION_ENABLED:-false}
      PRISM_AI_CREATIVE_V2_ENABLED: ${PRISM_AI_CREATIVE_V2_ENABLED:-false}
      PRISM_AI_DESIGN_LIBRARY_ENABLED: ${PRISM_AI_DESIGN_LIBRARY_ENABLED:-false}
      PRISM_AI_DESIGN_EMBEDDINGS_ENABLED: ${PRISM_AI_DESIGN_EMBEDDINGS_ENABLED:-false}
      PRISM_AI_DESIGN_EMBEDDING_PROVIDER: ${PRISM_AI_DESIGN_EMBEDDING_PROVIDER:-}
      PRISM_AI_DESIGN_EMBEDDING_MODEL: ${PRISM_AI_DESIGN_EMBEDDING_MODEL:-}
      PRISM_AI_DESIGN_EMBEDDING_DIMENSIONS: ${PRISM_AI_DESIGN_EMBEDDING_DIMENSIONS:-1536}
      PRISM_AI_MAX_GENERATIONS_PER_USER: ${PRISM_AI_MAX_GENERATIONS_PER_USER:-20}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_PLANNING_MODEL: ${OPENROUTER_PLANNING_MODEL:-}
      OPENROUTER_GENERATION_MODEL: ${OPENROUTER_GENERATION_MODEL:-}
      OPENROUTER_REPAIR_MODEL: ${OPENROUTER_REPAIR_MODEL:-}
      OPENROUTER_PLANNING_FALLBACKS: ${OPENROUTER_PLANNING_FALLBACKS:-}
      OPENROUTER_GENERATION_FALLBACKS: ${OPENROUTER_GENERATION_FALLBACKS:-}
      OPENROUTER_REPAIR_FALLBACKS: ${OPENROUTER_REPAIR_FALLBACKS:-}
      OPENROUTER_ALLOW_PAID_FALLBACK: ${OPENROUTER_ALLOW_PAID_FALLBACK:-false}
      OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-120}
      OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      OPENROUTER_MAX_REPAIR_ATTEMPTS: ${OPENROUTER_MAX_REPAIR_ATTEMPTS:-1}
      OPENROUTER_MAX_FALLBACKS: ${OPENROUTER_MAX_FALLBACKS:-2}
      OPENROUTER_MAX_REQUESTS_PER_GENERATION: ${OPENROUTER_MAX_REQUESTS_PER_GENERATION:-8}
      OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-8000}
      OPENROUTER_MAX_COST_PER_GENERATION_USD: ${OPENROUTER_MAX_COST_PER_GENERATION_USD:-0}
      OPENROUTER_DAILY_BUDGET_USD: ${OPENROUTER_DAILY_BUDGET_USD:-0}
      PRISM_DAILY_HOSTING_PRICE_PAISE: ${PRISM_DAILY_HOSTING_PRICE_PAISE:-50000}
      PRISM_DEFAULT_CURRENCY: ${PRISM_DEFAULT_CURRENCY:-INR}
      PRISM_MEDIA_STORAGE_PATH: /data/media
      PRISM_PUBLIC_BASE_URL: http://localhost:${PRISM_HTTP_PORT:-8088}
      PRISM_API_BASE_URL: http://localhost:${PRISM_HTTP_PORT:-8088}
      PRISM_COOKIE_SECURE: ${PRISM_COOKIE_SECURE:-false}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_OTP_TEMPLATE_NAME: ${WHATSAPP_OTP_TEMPLATE_NAME:-prism_otp}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PRISM_ADMIN_INITIAL_NAME: ${PRISM_ADMIN_INITIAL_NAME:-WebAux Admin}
      PRISM_ADMIN_INITIAL_PHONE: ${PRISM_ADMIN_INITIAL_PHONE:-9176791836}
      PRISM_ADMIN_INITIAL_PASSWORD: ${PRISM_ADMIN_INITIAL_PASSWORD:-}
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "${PRISM_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
